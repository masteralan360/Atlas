name = "atlas"
main = "src/index.js"
compatibility_date = "2026-09-05"
# Preserve any dashboard-managed non-secret runtime variables when this Worker
# is deployed with Wrangler. Secrets remain encrypted and are managed separately.
keep_vars = true

# The Vite build remains a static SPA. The Worker runs first so it can own the
# API gateway and select marketplace.html for shop.atlaserp.dev.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The shop host internally selects marketplace.html. Disable Cloudflare's
# default HTML-to-pretty-URL redirect, which would otherwise loop
# marketplace.html -> /marketplace -> marketplace.html.
html_handling = "none"
run_worker_first = true

[vars]
MARKETPLACE_HOST = "shop.atlaserp.dev"

[[services]]
binding = "JUMLA_KHALEEJ_FILES"
service = "jumla-khaleej-storefront"

# Keep this list in sync with the production Worker configuration. Values are
# intentionally not stored here: they must be added as Cloudflare secrets.
[secrets]
required = [
  "SUPABASE_URL",
  "SUPABASE_ANON_KEY",
  "SUPABASE_SERVICE_ROLE_KEY",
  "R2_WORKER_URL",
  "ATLAS_INQUIRY_PDF_SERVICE_TOKEN"
]

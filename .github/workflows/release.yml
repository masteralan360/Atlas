name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Windows GitHub runners can otherwise start Python with a legacy CP-1252
  # console encoding, which cannot emit all CI log output safely.
  PYTHONUTF8: "1"
  VITE_R2_WORKER_URL: ${{ secrets.VITE_R2_WORKER_URL }}
  VITE_R2_AUTH_TOKEN: ${{ secrets.VITE_R2_AUTH_TOKEN }}
  VITE_ENABLE_DEMO: ${{ secrets.VITE_ENABLE_DEMO }}
  VITE_ENCRYPTION_KEY: ${{ secrets.VITE_ENCRYPTION_KEY }}

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: windows-latest
          - platform: ubuntu-latest

    runs-on: ${{ matrix.settings.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.platform == 'ubuntu-latest' && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' || '' }}

      - name: Java setup (Android only)
        if: matrix.settings.platform == 'ubuntu-latest'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK setup (Android only)
        if: matrix.settings.platform == 'ubuntu-latest'
        uses: android-actions/setup-android@v3

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Tauri bundler tools (Windows only)
        if: matrix.settings.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: src-tauri/target/.tauri
          key: tauri-tools-windows-wix-3.14.1-nsis-3.11-v3

      - name: Provision WiX Toolset (Windows only)
        if: matrix.settings.platform == 'windows-latest'
        shell: pwsh
        run: |
          $wixToolsDir = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\target\.tauri\WixTools314'
          $candle = Join-Path $wixToolsDir 'candle.exe'
          if (Test-Path -LiteralPath $candle) {
            Write-Host "WiX Toolset is already cached."
            exit 0
          }

          New-Item -ItemType Directory -Path $wixToolsDir -Force | Out-Null
          $package = Join-Path $env:RUNNER_TEMP 'wixtoolset.3.14.1.20250415.nupkg'
          $packageDir = Join-Path $env:RUNNER_TEMP 'wixtoolset-package'
          curl.exe --fail --location --retry 5 --retry-all-errors --retry-delay 5 `
            --output $package `
            'https://community.chocolatey.org/api/v2/package/wixtoolset/3.14.1.20250415'
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to download the WiX Toolset package from Chocolatey.'
          }

          Expand-Archive -LiteralPath $package -DestinationPath $packageDir -Force
          $installer = Join-Path $packageDir 'tools\wix314.exe'
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "The WiX Toolset package did not contain wix314.exe."
          }

          $expectedSha256 = '6BF6D03D6923D9EF827AE1D943B90B42B8EBB1B0F68EF6D55F868FA34C738A29'
          $actualSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "WiX installer SHA-256 mismatch. Expected $expectedSha256, received $actualSha256."
          }

          $installerProcess = Start-Process -FilePath $installer -ArgumentList '/q' -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            throw "WiX Toolset installer failed with exit code $($installerProcess.ExitCode)."
          }

          $wixBinCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'),
            (Join-Path $env:ProgramFiles 'WiX Toolset v3.14\bin')
          )
          $wixBinDir = $wixBinCandidates | Where-Object {
            Test-Path -LiteralPath (Join-Path $_ 'candle.exe')
          } | Select-Object -First 1
          if (-not $wixBinDir) {
            throw 'WiX Toolset installed, but candle.exe could not be found.'
          }

          Copy-Item -Path (Join-Path $wixBinDir '*') -Destination $wixToolsDir -Recurse -Force

          if (-not (Test-Path -LiteralPath $candle)) {
            throw "WiX Toolset was provisioned but candle.exe was not found in $wixToolsDir."
          }

      - name: Provision NSIS Toolset (Windows only)
        if: matrix.settings.platform == 'windows-latest'
        shell: pwsh
        run: |
          $tauriToolsDir = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\target\.tauri'
          $nsisDir = Join-Path $tauriToolsDir 'NSIS'
          $nsisUtilityDll = Join-Path $nsisDir 'Plugins\x86-unicode\additional\nsis_tauri_utils.dll'
          $requiredFiles = @(
            'makensis.exe',
            'Bin\makensis.exe',
            'Stubs\lzma-x86-unicode',
            'Stubs\lzma_solid-x86-unicode',
            'Include\MUI2.nsh',
            'Include\FileFunc.nsh',
            'Include\x64.nsh',
            'Include\nsDialogs.nsh',
            'Include\WinMessages.nsh',
            'Include\Win\COM.nsh',
            'Include\Win\Propkey.nsh',
            'Include\Win\RestartManager.nsh'
          )

          function Download-VerifiedFile([string] $url, [string] $destination, [string] $expectedSha1) {
            curl.exe --fail --location --retry 5 --retry-all-errors --retry-delay 5 `
              --output $destination $url
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to download $url."
            }

            $actualSha1 = (Get-FileHash -LiteralPath $destination -Algorithm SHA1).Hash
            if ($actualSha1 -ne $expectedSha1) {
              throw "SHA-1 mismatch for $url. Expected $expectedSha1, received $actualSha1."
            }
          }

          $nsisIsComplete = (Test-Path -LiteralPath $nsisUtilityDll) -and
            -not ($requiredFiles | Where-Object { -not (Test-Path -LiteralPath (Join-Path $nsisDir $_)) })

          if (-not $nsisIsComplete) {
            if (Test-Path -LiteralPath $nsisDir) {
              Remove-Item -LiteralPath $nsisDir -Recurse -Force
            }

            New-Item -ItemType Directory -Path $tauriToolsDir -Force | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
            Download-VerifiedFile `
              'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip' `
              $archive `
              'EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D'

            Expand-Archive -LiteralPath $archive -DestinationPath $tauriToolsDir -Force
            $extractedNsisDir = Join-Path $tauriToolsDir 'nsis-3.11'
            if (-not (Test-Path -LiteralPath $extractedNsisDir)) {
              throw "NSIS archive did not contain the expected nsis-3.11 directory."
            }
            Rename-Item -LiteralPath $extractedNsisDir -NewName 'NSIS'

            $nsisUtilityDir = Split-Path -Parent $nsisUtilityDll
            New-Item -ItemType Directory -Path $nsisUtilityDir -Force | Out-Null
            Download-VerifiedFile `
              'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll' `
              $nsisUtilityDll `
              '75197FEE3C6A814FE035788D1C34EAD39349B860'
          }

          if (-not (Test-Path -LiteralPath $nsisUtilityDll)) {
            throw "NSIS toolchain was not provisioned completely."
          }

      - name: Restore google-services.json (Android only)
        if: matrix.settings.platform == 'ubuntu-latest'
        run: |
          mkdir -p src-tauri/gen/android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > src-tauri/gen/android/app/google-services.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests boto3

      - name: Clear R2 Updates (Initial)
        if: matrix.settings.platform == 'windows-latest'
        run: python .github/scripts/r2_release_helper.py clear
        shell: bash
        env:
          VITE_R2_WORKER_URL: ${{ secrets.VITE_R2_WORKER_URL }}
          VITE_R2_AUTH_TOKEN: ${{ secrets.VITE_R2_AUTH_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Build Windows
        if: matrix.settings.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_REQUIRE_BACKEND_CONFIGURATION: "false"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_DEMO: ${{ secrets.VITE_ENABLE_DEMO }}
          VITE_R2_WORKER_URL: ${{ secrets.VITE_R2_WORKER_URL }}
          VITE_R2_AUTH_TOKEN: ${{ secrets.VITE_R2_AUTH_TOKEN }}
          VITE_ENCRYPTION_KEY: ${{ secrets.VITE_ENCRYPTION_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Atlas ${{ github.ref_name }}"
          includeUpdaterJson: true
          releaseBody: "See the assets to download this version and install."

      - name: Upload Windows Assets to R2
        if: matrix.settings.platform == 'windows-latest'
        run: python .github/scripts/r2_release_helper.py upload
        shell: bash
        env:
          VITE_R2_WORKER_URL: ${{ secrets.VITE_R2_WORKER_URL }}
          VITE_R2_AUTH_TOKEN: ${{ secrets.VITE_R2_AUTH_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Build Android
        if: matrix.settings.platform == 'ubuntu-latest'
        run: npm run android:build:release
        env:
          VITE_REQUIRE_BACKEND_CONFIGURATION: "false"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_DEMO: ${{ secrets.VITE_ENABLE_DEMO }}
          VITE_R2_WORKER_URL: ${{ secrets.VITE_R2_WORKER_URL }}
          VITE_R2_AUTH_TOKEN: ${{ secrets.VITE_R2_AUTH_TOKEN }}
          VITE_ENCRYPTION_KEY: ${{ secrets.VITE_ENCRYPTION_KEY }}

      - name: Sign Release APK
        if: matrix.settings.platform == 'ubuntu-latest'
        run: |
          # Create keystore from secret
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks
          
          # Sign the universal production APK
          # Note: We use the universal release APK found in the output folder
          unsigned_apk=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name "*.apk" | head -n 1)
          
          # Sign using apksigner
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign --ks release.jks \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --out src-tauri/gen/android/app/build/outputs/apk/universal/release/Atlas_${{ github.ref_name }}.apk \
            "$unsigned_apk"

      - name: List APKs (Debug)
        if: matrix.settings.platform == 'ubuntu-latest'
        run: |
          echo "Listing all generated APKs (including signed release):"
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk"

      - name: Upload Android APKs
        if: matrix.settings.platform == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/Atlas_${{ github.ref_name }}.apk
            src-tauri/gen/android/app/build/outputs/apk/debug/*.apk
          tag_name: ${{ github.ref_name }}
          name: "Atlas ${{ github.ref_name }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false

      - name: Upload Android Assets to R2
        if: matrix.settings.platform == 'ubuntu-latest'
        run: python .github/scripts/r2_release_helper.py upload
        shell: bash
        env:
          VITE_R2_WORKER_URL: ${{ secrets.VITE_R2_WORKER_URL }}
          VITE_R2_AUTH_TOKEN: ${{ secrets.VITE_R2_AUTH_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

name: Deploy Atlas web to Cloudflare
run-name: Cloudflare deployment ${{ github.event.inputs.schedule_id || github.ref_name }}

on:
  push:
    branches: [main]
    paths-ignore:
      - '.release-config.json'
  workflow_dispatch:
    inputs:
      schedule_id:
        description: Scheduled release ID (set by the scheduled dispatcher)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  # Never let an older queued build deploy after a newer release.
  cancel-in-progress: true

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      hold: ${{ steps.gate.outputs.hold }}
    steps:
      - name: Checkout deployment metadata
        uses: actions/checkout@v4

      - name: Check scheduled release gate
        id: gate
        run: python .github/scripts/release_schedule_gate.py
        env:
          SCHEDULE_ID: ${{ github.event.inputs.schedule_id || '' }}
          SCHEDULE_GATE_SCOPE: cloudflare

  deploy:
    needs: schedule-gate
    if: needs.schedule-gate.result == 'success' && needs.schedule-gate.outputs.hold != 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run type-check
      - run: npm test -- cloudflare-web/src/index.test.js
      - run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_WORKER_URL: ${{ secrets.R2_WORKER_URL }}
          # A base64-encoded JSON object of the local .env contents. GitHub
          # stores this as an encrypted production secret; the deployment
          # script decodes it only in memory and applies it as Worker secrets.
          CLOUDFLARE_WORKER_SECRETS_B64: ${{ secrets.CLOUDFLARE_WORKER_SECRETS_B64 }}
      - run: node scripts/verify-cloudflare-deployment.mjs
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

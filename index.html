<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/AtlasClear.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Atlas Enterprise Resource Planning System" />
  <link rel="apple-touch-icon" href="/pwa-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Atlas</title>
  <style>
    /* Covers the brief interval before Vite has loaded the application styles. */
    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #000;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <div id="atlas-shell-recovery" hidden role="alert" aria-live="assertive">
    <div>
      <p>Atlas has not loaded yet.</p>
      <button id="atlas-shell-retry" type="button">Retry</button>
    </div>
  </div>
  <style>
    #atlas-shell-recovery {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f8fafc;
      color: #0f172a;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    #atlas-shell-recovery[hidden] { display: none; }
    #atlas-shell-recovery p { margin: 0 0 16px; }
    #atlas-shell-retry {
      border: 0;
      border-radius: 8px;
      padding: 12px 20px;
      background: #64748b;
      color: #fff;
      font: inherit;
      font-weight: 600;
    }
  </style>
  <script>
    (function () {
      var recovery = document.getElementById('atlas-shell-recovery');
      var retry = document.getElementById('atlas-shell-retry');
      if (retry) retry.addEventListener('click', function () { window.location.reload(); });
      window.setTimeout(function () {
        if (recovery && recovery.dataset.dismissed !== 'true') recovery.hidden = false;
      }, 5000);
    }());
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

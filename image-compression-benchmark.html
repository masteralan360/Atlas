<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas image compression benchmark</title>
    <style>
      body { margin: 0; padding: 24px; background: #0b1020; color: #e5e7eb; font: 14px/1.45 system-ui, sans-serif; }
      h1 { margin: 0 0 8px; } p { color: #a5b4fc; }
      table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #111827; }
      th, td { border: 1px solid #334155; padding: 8px; text-align: left; }
      th { background: #1e293b; } .pass { color: #86efac; } .miss { color: #fca5a5; }
      button { border: 0; border-radius: 8px; padding: 10px 14px; background: #4f46e5; color: white; cursor: pointer; }
      pre { max-height: 240px; overflow: auto; background: #020617; padding: 12px; }
    </style>
  </head>
  <body>
    <h1>Atlas image compression benchmark</h1>
    <p>Deterministic, rights-safe product, logo, portrait, activity, and print fixtures. Results use the production browser pipeline.</p>
    <button id="run" type="button">Run benchmark</button>
    <div id="status">Ready</div>
    <div id="results"></div>
    <pre id="json"></pre>
    <script type="module" src="/src/dev/imageCompressionBenchmark.ts"></script>
  </body>
</html>
